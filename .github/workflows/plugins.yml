name: Plugins

# One push to a branch here raises both events, so `push` covers only main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --workspaces=false
      - run: npm test
      - run: npm run check:ui
      # A workflow GitHub refuses to parse fails as a run with no jobs at all,
      # which says nothing about why.
      - name: Lint the workflows
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          command -v shellcheck > /dev/null || {
            echo "::error::shellcheck is missing, so actionlint would skip it"
            exit 1
          }
          curl -sSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint

  discover:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.plugins.outputs.plugins }}
    steps:
      - uses: actions/checkout@v7
      - id: plugins
        run: |
          plugins=$(
            for directory in plugins/*/; do
              if [ -f "$directory/package.json" ]; then
                basename "$directory"
              fi
            done | jq -R -s -c 'split("\n") | map(select(length > 0))'
          )
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  release-check:
    needs: discover
    name: ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.discover.outputs.plugins) }}
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: plugins/${{ matrix.plugin }}/package-lock.json
      - run: npm ci --workspaces=false
      - run: npm run release:check

  # The one name this workflow is required by. release-check names its jobs
  # from a matrix, so requiring those would break whenever a plugin is renamed.
  plugins:
    needs: [release-automation, discover, release-check]
    # A check skipped along with its dependency never reports, which blocks the
    # pull request requiring it.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "$results"
          case "$results" in
            *failure*|*cancelled*) echo "::error::a required job did not pass"; exit 1 ;;
          esac
