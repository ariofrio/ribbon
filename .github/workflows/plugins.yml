name: Plugins

# One push to a branch here raises both events, so an unrestricted `push`
# would run every job twice. A pull request covers the branches; this covers
# main, which only a merge writes to.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --workspaces=false
      - run: npm test
      - run: npm run check:ui

  discover:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.plugins.outputs.plugins }}
    steps:
      - uses: actions/checkout@v7
      - id: plugins
        run: |
          plugins=$(
            for directory in plugins/*/; do
              if [ -f "$directory/package.json" ]; then
                basename "$directory"
              fi
            done | jq -R -s -c 'split("\n") | map(select(length > 0))'
          )
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  release-check:
    needs: discover
    name: ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.discover.outputs.plugins) }}
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: plugins/${{ matrix.plugin }}/package-lock.json
      - run: npm ci --workspaces=false
      - run: npm run release:check

  # The one name this workflow is required by. A required check is matched by
  # name, and release-check names its jobs from a matrix built at run time, so
  # requiring those directly would block every pull request as soon as a plugin
  # is renamed — and would leave a newly added one unrequired. This waits for
  # them instead, and `workflows.test.mjs` fails if a job escapes it.
  plugins:
    needs: [release-automation, discover, release-check]
    # Reports whatever the others did, rather than being skipped along with
    # them; a check that never reports blocks the pull request requiring it.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "$results"
          case "$results" in
            *failure*|*cancelled*) echo "::error::a required job did not pass"; exit 1 ;;
          esac
