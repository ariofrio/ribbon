name: Screenshots

# Recaptures every shot and commits back whatever came out different. The
# capture is its own check: a harness that renders the same bytes twice makes
# an unchanged picture indistinguishable from no change, so git's own diff
# answers what a recorded digest used to be asked.
on:
  push:
    # The whole gate, now that nothing records what a shot was captured from.
    # What a push touched is what decides whether a picture can have moved, so
    # a path that belongs here and is missing is a screenshot that stays stale
    # until some later push happens to touch one that is listed.
    # `trigger.test.mjs` pins both halves of this list.
    paths:
      - "plugins/*/src/**"
      # Neither shipped nor bundled, so no test can move a pixel — and a full
      # capture costs five minutes to redraw an identical set of files.
      - "!plugins/*/src/**/*.test.ts"
      - "!plugins/*/src/**/*.test.tsx"
      # A dependency can change what a plugin draws.
      - "plugins/*/package.json"
      - "scripts/screenshots/**"
      - "!scripts/screenshots/*.test.mjs"
      # Pins playwright, which decides the container tag below, which decides
      # the Chromium that rasterises every glyph.
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

# A second push supersedes the first: the older run would recapture a tree
# nobody is on, and its push would lose the race anyway.
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recapture:
    # A fork's token cannot push here, and pull_request_target would hand a
    # fork's plugin build a writable one. A fork's screenshots are recaptured
    # once its work reaches main, which recaptures on its own push.
    if: github.repository == 'ariofrio/ribbon'
    runs-on: ubuntu-latest
    # Pinned rather than ubuntu-latest: the runner image's fonts and libraries
    # move between releases, and every glyph a capture rasterises comes from
    # them. The tag tracks the playwright version in package-lock.json, which
    # decides the Chromium on disk.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/screenshots/package-lock.json
      # bb-app builds node-pty from source here, which the image has no
      # compiler for; and git refuses a checkout it did not make itself.
      - name: Prepare the container
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 make g++
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci --workspaces=false
      # bb itself.
      - run: npm ci --prefix scripts/screenshots
      - run: npm run screenshots
      - name: Commit what changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A assets plugins/*/assets
          if git diff --cached --quiet; then
            echo "The capture reproduced what is committed; nothing to push."
            exit 0
          fi
          git commit -m "Recapture the screenshots this branch moved"
          git push origin "HEAD:${GITHUB_REF_NAME}"
