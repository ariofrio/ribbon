name: Screenshots

# Nothing records what each shot was captured from: the harness renders the
# same bytes twice, so git already reports whether a screenshot changed.
#
# The caller runs this after validation and reports the required `recapture`
# check. Main still captures a branch that merged without its screenshots.
on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Keep the relevance decision on the hosted runner. Starting the renderer
  # container is most of the cost of a pull request that needs no capture.
  relevant:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      capture: ${{ steps.relevant.outputs.capture }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - id: key
        run: echo "key=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: .scratch/ci-passed
          key: ci-screenshots-v1-${{ steps.key.outputs.key }}
          lookup-only: true
      - id: relevant
        if: steps.cache.outputs.cache-hit != 'true'
        name: Decide whether anything can have moved a picture
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/screenshots/affects.mjs >> "$GITHUB_OUTPUT"

  capture:
    needs: relevant
    if: needs.relevant.outputs.capture == 'true'
    runs-on: ubuntu-latest
    # Pinned rather than ubuntu-latest: the runner image's fonts and libraries
    # move between releases, and every glyph a capture rasterises comes from
    # them. The tag tracks the playwright version in package-lock.json, which
    # decides the Chromium on disk.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      # A GITHUB_TOKEN-authored PR update waits for manual approval. Give only
      # same-repository PRs a short-lived App token; forks keep their read-only
      # token and stop before the push below.
      - uses: actions/create-github-app-token@v3
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: app-token
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          # Capture the immutable source that started this run, then push the
          # resulting commit to its branch below.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          # GitHub Actions cannot be a bypass actor on a repository a person
          # owns, so this workflow's token cannot write to main. Protect main
          # lets a deploy key through instead.
          ssh-key: ${{ github.event_name == 'push' && secrets.SCREENSHOTS_DEPLOY_KEY || '' }}
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # npm invokes node-gyp for bb-app's bundled better-sqlite3 even with
      # packaged prebuilds. Keep the native-build tools until npm fixes this.
      - name: Prepare the container
        run: apt-get update
      - name: Install the native build tools
        run: apt-get install -y make g++ zstd
      # Install every workspace together so the screenshot harness and all
      # five plugins share one bb-app and one native dependency build.
      - run: npm ci
      - run: npm run screenshots
      - name: Commit what changed
        id: commit
        # Whoever opened the pull request chose these. Interpolating them with
        # ${{ }} would paste them into the script for bash to parse; read from
        # the environment they are values, not code.
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add -A assets plugins/*/assets
          echo "key=$(git write-tree)" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo "The capture reproduced what is committed; nothing to push."
            exit 0
          fi
          # A fork's token is read-only, so report what moved instead.
          if [ "$GITHUB_EVENT_NAME" != "push" ] && [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            git diff --cached --stat
            echo "::error::These screenshots moved. A maintainer has to recapture them; a fork's token cannot push."
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Recapture the screenshots this branch moved"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Save before pushing: that push can cancel this run immediately.
      - name: Mark this capture successful
        run: mkdir -p .scratch && touch .scratch/ci-passed
      - uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .scratch/ci-passed
          key: ci-screenshots-v1-${{ steps.commit.outputs.key }}
      - name: Push the captured commit
        if: steps.commit.outputs.changed == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git push origin "HEAD:${HEAD_REF:-$GITHUB_REF_NAME}"
      - name: Upload screenshot diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scratch/screenshots/bb.log
          if-no-files-found: error
          include-hidden-files: true
