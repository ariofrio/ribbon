name: Version plugins

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --workspaces=false
      # A GITHUB_TOKEN-authored pull request waits for manual approval.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: changesets/action@v2.1.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: npm run version:plugins
          commit-message: Version plugins
          pr-title: Version plugins
          pr-base-branch: main
          create-github-releases: false
          push-git-tags: false
